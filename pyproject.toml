[project]
name = "blunder-the-weather"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adhham Zaatri", email = "arzaatri@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.16",
    "dagster-aws>=0.29.16",
    "dagster-dbt>=0.29.16",
    "dagster-webserver>=1.13.16",
    "dbt-core>=1.11.12",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "great-expectations>=1.20.0",
    "joblib>=1.5.3",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
]

[project.scripts]
blunder-the-weather = "blunder_the_weather:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
