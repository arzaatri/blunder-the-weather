# "Storm watch" dark theme: moody navy/slate control-room look, with a cyan accent
# kept deliberately distinct from the app's own red/orange/green risk-color vocabulary
# (map dots, METRIC_COLORS in dashboard/app.py) so UI chrome is never confused with an
# actual risk signal. Adapted from Streamlit's bundled financial-dashboard theme.
[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#F1F5F9"
borderColor = "#334155"
linkColor = "#22D3EE"
codeBackgroundColor = "#1E293B"
codeTextColor = "#CBD5E1"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
linkUnderline = false

redColor = "#F43F5E"
orangeColor = "#FB923C"
yellowColor = "#FBBF24"
greenColor = "#34D399"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"

# Only affects charts with no explicit color encoding (e.g. the SHAP bar_chart) --
# the volatility line chart drives its own colors via METRIC_COLORS + an explicit
# alt.Scale in dashboard/app.py, and st.pydeck_chart isn't a native Streamlit chart
# type at all, so neither reads this.
chartCategoricalColors = ["#22D3EE", "#F43F5E", "#60A5FA", "#94A3B8", "#34D399", "#FB923C", "#A78BFA", "#FBBF24"]

dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"
