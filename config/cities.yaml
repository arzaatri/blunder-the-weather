# spacing_km: 25 to stay well above observed model grid-snap noise (~11km worst case).
grid:
  size: 3
  spacing_km: 25.0

cities:
  - city_id: nyc
    name: New York City
    center_lat: 40.7128
    center_lon: -74.0060
  - city_id: sf
    name: San Francisco
    center_lat: 37.7749
    center_lon: -122.4194
  - city_id: chi
    name: Chicago
    center_lat: 41.8781
    center_lon: -87.6298
