# Non-secret application configuration. Credentials live in .env (see .env.example), never here.
minio:
  endpoint_url: "http://localhost:9100"
  bucket: "blunder-the-weather"

logging:
  level: "INFO"

# Which concrete provider fills each role (see providers/factory.py for the registry
# of valid names). Independently swappable -- change one line, no code changes.
providers:
  actuals: "open_meteo"
  historical_forecast: "open_meteo"
  live_forecast: "open_meteo"

# Backfill window. start_date is a fixed anchor -- 60 days back from when this was
# widened (2026-08-09) -- not a rolling "N days before today", so the partition set only
# grows and earlier historical partitions never fall out of range. end_lag_days is a
# safety buffer behind the confirmed data-availability lag (both source APIs were
# current as of yesterday).
backfill:
  start_date: "2026-06-10"
  end_lag_days: 2

# provisional, not yet tuned against real error percentiles
thresholds:
  temp_max_celsius: 3.0
  temp_min_celsius: 3.0
  cloud_cover_pp: 25.0
  humidity_pp: 15.0
  precip_chance_cutoff_pct: 50.0

models:
  holdout_frac: 0.25
  calib_fraction: 0.2
  class_weight: "balanced"
  random_state: 0

# Fixed anchor for live-scoring partitions -- the day live scoring started, not a
# rolling offset (same reasoning as backfill.start_date).
live:
  start_date: "2026-08-09"

# Equal by default; not required to sum to 1 (normalized in code). Tune per-dimension
# once there's evidence some errors matter more than others for the combined score.
ensemble:
  weights:
    temp_max: 1.0
    temp_min: 1.0
    cloud_cover: 1.0
    humidity: 1.0
    precip_chance: 1.0

# How the dashboard collapses each city's 9 grid points into one number for display.
# "mean" reads as "expected reliability"; "max" reads as "worst case anywhere in the
# city" -- switch to "max" if the point is closer to a warning than a summary.
dashboard:
  city_aggregation: "mean"
