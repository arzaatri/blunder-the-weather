# Non-secret application configuration. Credentials live in .env (see .env.example), never here.
minio:
  endpoint_url: "http://localhost:9100"
  bucket: "blunder-the-weather"

logging:
  level: "INFO"

# Which concrete provider fills each role (see providers/factory.py for the registry
# of valid names). Independently swappable -- change one line, no code changes.
providers:
  actuals: "open_meteo"
  historical_forecast: "open_meteo"
  live_forecast: "open_meteo"

# Backfill window, relative to today. end_lag_days is a safety buffer behind the
# confirmed data-availability lag (both source APIs were current as of yesterday).
backfill:
  lookback_days: 10
  end_lag_days: 2

# provisional, not yet tuned against real error percentiles
thresholds:
  temp_max_celsius: 3.0
  cloud_cover_pp: 25.0
  humidity_pp: 15.0
  precip_chance_cutoff_pct: 50.0
