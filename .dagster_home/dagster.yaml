# Sequential run execution: Open-Meteo is a free, unauthenticated API, and concurrent
# runs each firing large multi-location requests tripped its rate limit (confirmed
# during Phase 2 backfill -- "too many 429 error responses").
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1

# Raised from the default (5) so that if the app/daemon is off for a stretch (a couple
# weeks, say), the daily schedules catch up on every missed day's partition once it's
# running again instead of silently dropping the oldest missed days -- this is the
# built-in Dagster mechanism behind the "no hard dependency on same-day execution" goal.
scheduler:
  module: dagster.core.scheduler
  class: DagsterDaemonScheduler
  config:
    max_catchup_runs: 30
